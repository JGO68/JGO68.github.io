{%- comment -%} Section Mixes des 3 accueils. Paramètre : langue (fr, en, es). Mixes : _data/entreprise.yml. {%- endcomment -%}
{%- assign t = site.data.accueil[include.langue] -%}
<section id="mixes" class="py-32 bg-gradient-to-b from-gray-900 to-black">
        <div class="container mx-auto px-4">
            <h2 class="gradient-text text-5xl font-bold text-center mb-16" data-aos="fade-up">
                {{ t.mixes }}
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                {%- for mix in site.data.entreprise.mixes %}
                <!-- Mix {{ forloop.index }}: {{ mix.titre }} -->
                <div class="bg-black/50 p-4 rounded-xl backdrop-blur-md hover-scale" data-aos="fade-up"
                    data-aos-delay="{{ forloop.index | times: 100 }}">
                    <div class="w-full rounded-lg overflow-hidden">
                        <iframe width="100%" height="120" title="DJ Steeve H. - {{ mix.titre }}"
                            src="https://www.mixcloud.com/widget/iframe/?feed={{ mix.mixcloud }}&hide_cover=1&light=0"
                            frameborder="0" allow="autoplay" loading="lazy">
                        </iframe>
                    </div>
                </div>
                {%- endfor %}
            </div>
        </div>
    </section>

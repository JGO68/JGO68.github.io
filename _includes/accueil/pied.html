{%- comment -%} Pied de page des 3 accueils. Paramètre : langue (fr, en, es). Textes : _data/accueil.yml. {%- endcomment -%}
{%- assign t = site.data.accueil[include.langue] -%}
<footer class="bg-black py-8">
        <div class="container mx-auto px-4 text-center text-gray-400">
            <p class="text-lg mb-4">{{ t.titre }}</p>
            <p class="text-sm mb-2">{{ t.specialite }}</p>
            <a href="{{ site.data.entreprise.facebook }}" target="_blank" rel="noopener noreferrer"
                aria-label="{{ t.facebook }}"
                class="inline-block mb-4 text-orange-500 hover:text-orange-400 transition-colors duration-300">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill-rule="evenodd"
                        d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"
                        clip-rule="evenodd"></path>
                </svg>
            </a>
            <p class="text-sm">© {{ site.time | date: '%Y' }} DJ Steeve H. {{ t.droits }}</p>
        </div>
    </footer>

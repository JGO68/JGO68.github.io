{%- comment -%} Boutons « Demander une soumission » et « Appeler » du haut des pages services. {%- endcomment -%}

<div class="mt-8 flex flex-col gap-3 sm:flex-row sm:flex-wrap">
                        <a href="#contact"
                            class="inline-flex items-center justify-center rounded-lg bg-gradient-to-r from-orange-500 to-orange-600 px-6 py-4 text-center text-lg font-bold text-white shadow-lg shadow-orange-950/30 transition-all hover:-translate-y-1 hover:from-orange-600 hover:to-orange-700">
                            Demander une soumission
                        </a>
                        <a href="{{ tel.lien }}"

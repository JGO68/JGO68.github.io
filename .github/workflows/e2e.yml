# Tests e2e du site : à chaque pull request et à chaque mise à jour de main.
# Le site est compilé exactement comme GitHub Pages (Jekyll), puis testé dans
# le conteneur officiel de Playwright (rendu identique d'une machine à l'autre).
name: Tests e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Compiler le site (Jekyll, comme GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 3

  tester:
    name: Tests e2e
    needs: compiler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - run: npm ci --no-audit --no-fund
      - run: npx playwright test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report
          retention-days: 14
